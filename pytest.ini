[pytest]
# pytest 配置文件

# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = tests

# 命令行选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=utils
    --cov-report=html:reports/coverage
    --cov-report=term-missing
    --timeout=86400
    --timeout-method=thread

# 标记说明
markers =
    stability: 稳定性测试标记
    system_robustness: 系统健壮性测试标记
    exception_recovery: 异常恢复测试标记
    performance: 性能测试标记
    performance_response: 响应性能测试标记
    performance_resource: 资源消耗测试标记
    slow: 慢速测试标记（长时间运行）
    requires_device: 需要真实设备连接的测试
    requires_mock_server: 需要 Mock Server 的测试
    requires_network_proxy: 需要网络代理的测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = [%(asctime)s] [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 报告配置
# 使用 pytest-html 生成 HTML 报告
# 使用 pytest-json-report 生成 JSON 报告（可选）
